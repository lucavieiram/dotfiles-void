## Feral GameMode — applied while gamemoderun-prefixed programs are running.
## Daemon (gamemoded) is D-Bus auto-activated; no service to enable.
##
## With this config, launching a game via `gamemoderun %command%` (Steam
## launch options) yields:
##   - CPU governor switched to performance
##   - non-game processes pinned away from optimal cores
##   - NVIDIA PowerMizer locked at max performance
##   - screensaver inhibited
##   - notification on enter/leave (visible via dunst)
##
## See https://github.com/FeralInteractive/gamemode

[general]
desiredgov=performance
defaultgov=schedutil
softrealtime=auto
inhibit_screensaver=1
ioprio=0

[cpu]
# Don't park (offline) cores during gameplay — keep all available for the OS.
park_cores=no
# Pin non-game processes AWAY from the "optimal" cores gamemode picks for
# the game. Works well with Intel P-core/E-core hybrid (i5-13420H here).
pin_cores=yes

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
# NVIDIA PowerMizer: 0=adaptive, 1=prefer max performance, 2=auto.
# Mode 1 locks the GPU at max clocks while gamemode is active.
nv_powermizer_mode=1

[custom]
start=notify-send -t 2000 -i input-gaming "GameMode" "Performance mode active"
end=notify-send -t 2000 -i input-gaming "GameMode" "Back to normal"
