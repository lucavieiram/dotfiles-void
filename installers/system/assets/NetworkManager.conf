# NetworkManager configuration.
# Per-connection settings live in /etc/NetworkManager/system-connections/.

[main]
plugins=keyfile

[device]
# WiFi backend: wpa_supplicant is already installed and well-tested on Void.
wifi.backend=wpa_supplicant
# MAC randomization on scan (privacy in public wifi).
# Stable per-SSID once connected so DHCP leases remain consistent.
wifi.scan-rand-mac-address=yes

[connection]
# Per-connection MAC: 'stable' = same MAC each time on the same SSID.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent

[connectivity]
# Captive portal detection: NM fetches this URL; if it gets the wrong body
# it marks the connection as 'portal' and nm-applet fires a notification
# with a 'Log in' button that opens the browser to the portal page.
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=300
response=NetworkManager is online

[logging]
level=INFO
