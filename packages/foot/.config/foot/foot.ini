# ~/.config/foot/foot.ini
# Wayland-native terminal. Gruvbox-dark + slight transparency to match
# the waybar pill aesthetic.

[colors-dark]
alpha=0.92
foreground=ebdbb2
background=282828
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

[main]
font=JetBrainsMono Nerd Font:size=12
pad=14x14 center
dpi-aware=yes
selection-target=clipboard
shell=/bin/zsh

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+r
spawn-terminal=Control+Shift+n
# show-urls-launch=Control+Shift+u   # collides with unicode-input; use Ctrl+Shift+o instead
show-urls-launch=Control+Shift+o

[mouse-bindings]
selection-override-modifiers=Shift
primary-paste=BTN_MIDDLE
select-begin=BTN_LEFT
select-extend=BTN_RIGHT
