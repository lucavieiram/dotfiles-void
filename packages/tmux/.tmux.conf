# ~/.tmux.conf — minimal Gruvbox-tinted tmux config
# No external plugins required.

# ── Prefix ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ── Splits + navigation (vim-like) ────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window    -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ── Copy mode (vi keys, system clipboard) ─────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'wl-copy'

# ── Gruvbox status line ───────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left  "#[bg=#fabd2f,fg=#1d2021,bold] #S #[bg=#1d2021,fg=#fabd2f]"
set -g status-right "#[fg=#83a598]#H #[fg=#fabd2f]%H:%M "
set -g window-status-format         "  #I:#W  "
set -g window-status-current-format "#[bg=#3c3836,fg=#fabd2f,bold] #I:#W "

set -g pane-border-style        "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style            "bg=#3c3836,fg=#fabd2f"
