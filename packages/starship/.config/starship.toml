# Starship prompt — Gruvbox + Void green (#478061) primary accent.
# Adapted from Hyprlust starship.toml.
# https://starship.rs/config/

format = """
[](#478061)\
$os\
$username\
[](bg:#504945 fg:#478061)\
$directory\
[](fg:#504945 bg:#3c3836)\
$git_branch\
$git_status\
[](fg:#3c3836 bg:#282828)\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$kubernetes\
$terraform\
[](fg:#282828 bg:none)\
$line_break$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol   = "[❯](bold #fb4934)"
vimcmd_symbol  = "[❮](bold #fabd2f)"

[os]
disabled = false
style = "bg:#478061 fg:#ebdbb2"
[os.symbols]
Void    = " "
Linux   = " "
Arch    = " "
Macos   = " "
Windows = " "

[username]
show_always = true
style_user = "bg:#478061 fg:#ebdbb2"
style_root = "bg:#fb4934 fg:#1d2021"
format = '[ $user ]($style)'

[directory]
style = "bg:#504945 fg:#b8bb26"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "
"Code"      = " "
"Projects"  = " "

[git_branch]
symbol = ""
style = "bg:#3c3836 fg:#83a598"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#3c3836 fg:#fb4934"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:#282828 fg:#b8bb26"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "bg:#282828 fg:#fe8019"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "bg:#282828 fg:#8ec07c"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "bg:#282828 fg:#fabd2f"
format = '[ $symbol $version ]($style)'

[docker_context]
symbol = ""
style = "bg:#282828 fg:#83a598"
format = '[ $symbol $context ]($style)'

[kubernetes]
disabled = false
symbol = "⎈ "
style = "bg:#282828 fg:#83a598"
format = '[ $symbol$context ($namespace)]($style)'

[terraform]
symbol = "󱁢 "
style = "bg:#282828 fg:#d3869b"
format = '[ $symbol $workspace ]($style)'

[time]
disabled = true

[cmd_duration]
min_time = 2000
format = "took [$duration](bold #fabd2f) "

[line_break]
disabled = false
