# yazi — fast TUI file manager
# https://yazi-rs.github.io/

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 600
max_height    = 900
cache_dir     = ""
image_filter  = "triangle"
image_quality = 75

# Openers: Enter uses the first one in the list, O shows all of them.
[opener]
edit = [
    { run = '${EDITOR:-nvim} %s', desc = "Edit (nvim)", block = true, for = "unix" },
]
pdf = [
    { run = 'zathura %s', desc = "zathura", orphan = true, for = "unix" },
]
image = [
    { run = 'imv %s', desc = "imv", orphan = true, for = "unix" },
]
play = [
    { run = 'mpv %s', desc = "mpv", orphan = true, for = "unix" },
]
office = [
    { run = 'libreoffice %s', desc = "LibreOffice", orphan = true, for = "unix" },
]
browser = [
    { run = 'firefox %s', desc = "Firefox", orphan = true, for = "unix" },
]
open = [
    { run = 'xdg-open %s1', desc = "Default app", orphan = true, for = "linux" },
]
reveal = [
    { run = 'xdg-open %d1', desc = "Open folder in file manager", orphan = true, for = "linux" },
]
extract = [
    { run = 'ya pub extract --list %s', desc = "Extract here" },
]

[open]
rules = [
    { mime = "folder/*",          use = ["edit", "reveal"] },
    { url  = "*.{html,htm,svg}",  use = ["browser", "edit"] },
    { mime = "text/*",            use = ["edit", "open"] },
    { mime = "inode/empty",       use = "edit" },
    { mime = "application/{json,ndjson,javascript,toml,x-shellscript}", use = "edit" },
    { mime = "application/pdf",   use = ["pdf", "browser", "open"] },
    { url  = "*.epub",            use = ["pdf", "open"] },
    { mime = "image/*",           use = ["image", "browser", "open"] },
    { mime = "{audio,video}/*",   use = ["play", "open"] },
    { url  = "*.{doc,docx,odt,rtf,xls,xlsx,ods,csv,ppt,pptx,odp}", use = ["office", "edit"] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "open"] },
    { url  = "*",                 use = ["open", "edit", "reveal"] },
]

[tasks]
bizarre_retry = 5
image_alloc   = 536870912    # 512 MB
image_bound   = [0, 0]
