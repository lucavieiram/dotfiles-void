# yazi — fast TUI file manager
# https://yazi-rs.github.io/

[manager]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
tab_size       = 2
max_width      = 600
max_height     = 900
cache_dir      = ""
image_filter   = "triangle"
image_quality  = 75
sixel_fraction = 15

[opener]
edit = [
    { run = '$EDITOR "$@"',         block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$@"',        desc = "Open", for = "linux" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
]
extract = [
    { run = 'unar "$1"',            desc = "Extract here", for = "unix" },
]
play = [
    { run = 'mpv "$@"',             orphan = true, for = "unix" },
]

[open]
rules = [
    { name = "*/", use = "edit" },
    { mime = "text/*",                                       use = "edit" },
    { mime = "image/*",                                      use = "open" },
    { mime = "video/*",                                      use = "play" },
    { mime = "audio/*",                                      use = "play" },
    { mime = "application/zip",                              use = "extract" },
    { mime = "application/x-7z-compressed",                  use = "extract" },
    { mime = "application/x-tar",                            use = "extract" },
    { mime = "application/x-bzip2",                          use = "extract" },
    { mime = "application/x-gzip",                           use = "extract" },
    { mime = "application/pdf",                              use = "open" },
    { mime = "application/*",                                use = "open" },
    { mime = "*",                                            use = "open" },
]

[tasks]
micro_workers    = 5
macro_workers    = 10
bizarre_retry    = 5
image_alloc      = 536870912    # 512 MB
image_bound      = [0, 0]

[log]
enabled = false
