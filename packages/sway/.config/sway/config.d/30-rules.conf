# 30-rules.conf — window rules
# Apply class/app_id rules for floating dialogs, pickers, popups.

# ── Floating utility windows ──────────────────────────────────────
for_window [app_id="pavucontrol"]                floating enable, resize set 800 600
for_window [app_id="pavucontrol-qt"]             floating enable, resize set 800 600
for_window [app_id="qt5ct"]                      floating enable, resize set 700 500
for_window [app_id="qt6ct"]                      floating enable, resize set 700 500
for_window [app_id="nm-connection-editor"]       floating enable
for_window [app_id="lxqt-policykit-agent"]       floating enable
for_window [app_id="org.kde.polkit-kde-authentication-agent-1"] floating enable
for_window [app_id="firefox" title="^Picture-in-Picture$"]       floating enable, sticky enable
for_window [title="^Picture-in-Picture$"]        floating enable, sticky enable
for_window [app_id="org.keepassxc.KeePassXC"]    floating disable
for_window [app_id="thunar" title="^File Operation Progress$"] floating enable
for_window [window_role="pop-up"]                floating enable
for_window [window_role="dialog"]                floating enable
for_window [window_role="task_dialog"]           floating enable
for_window [window_type="dialog"]                floating enable

# ── Cheatsheet windows (Super+/ , Super+Shift+/) ──────────────────
for_window [app_id="cheatsheet"] {
    floating enable
    resize set 900 px 650 px
    move position center
    border pixel 1
    opacity 0.97
}


# ── Steam ─────────────────────────────────────────────────────────
for_window [class="Steam"]            floating enable
for_window [class="Steam" title="^Steam$"] floating disable
for_window [class="steam" title="^Friends List$"] floating enable, resize set 400 700

# ── Inhibit idle when fullscreen / media plays ────────────────────
for_window [class=".*"]   inhibit_idle fullscreen
for_window [app_id=".*"]  inhibit_idle fullscreen

# ── Allow tearing for games (uncap FPS past monitor refresh) ──────
# Apps opt-in via the tearing_control Wayland protocol — Firefox/foot/
# etc. don't request it, so they're unaffected. Vulkan games with vsync
# off (CS2 with +fps_max 0) get immediate present and run uncapped.
for_window [class=".*"]   allow_tearing yes
for_window [app_id=".*"]  allow_tearing yes
