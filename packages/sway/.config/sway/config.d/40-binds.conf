# 40-binds.conf — minimal keybinds (only what the user actually uses)

# ── Window management ─────────────────────────────────────────────
bindsym $mod+q              kill
bindsym $mod+f              fullscreen
bindsym $mod+Space          floating toggle
bindsym $mod+Shift+l        layout toggle split tabbed
floating_modifier $mod normal

# ── Focus (arrows + hjkl) ─────────────────────────────────────────
bindsym $mod+Left           focus left
bindsym $mod+Right          focus right
bindsym $mod+Up             focus up
bindsym $mod+Down           focus down
bindsym $mod+h              focus left
bindsym $mod+j              focus down
bindsym $mod+k              focus up
# $mod+l is reserved for lock — use Right arrow for focus right
# Keyboard-layout switch: $mod+Shift+k (see below)

# ── Application launchers ─────────────────────────────────────────
bindsym $mod+Return         exec $term
bindsym $mod+t              exec $term
bindsym $mod+b              exec $browser
bindsym $mod+c              exec $term -e $editor
bindsym $mod+e              exec $files
bindsym $mod+a              exec $menu
bindsym $mod+slash          exec ~/.local/bin/cheatsheet.sh sway
bindsym $mod+Shift+slash    exec ~/.local/bin/cheatsheet.sh nvim
bindsym $mod+Ctrl+slash     exec ~/.local/bin/cheatsheet.sh tmux

# ── Lock / Power / Wallpaper / Monitor / Keyboard ─────────────────
bindsym $mod+l              exec ~/.local/bin/lock-now.sh
bindsym Ctrl+Alt+Delete     exec ~/.local/bin/powermenu.sh
bindsym $mod+Shift+w        exec ~/.local/bin/wallpaper.sh select
bindsym $mod+Alt+Right      exec ~/.local/bin/wallpaper.sh next
bindsym $mod+Alt+Left       exec ~/.local/bin/wallpaper.sh prev
bindsym $mod+Shift+m        exec ~/.local/bin/monitor-profile.sh
bindsym $mod+Shift+k        exec ~/.local/bin/kb-layout-switch.sh
bindsym $mod+Shift+f        exec acer-profile-switcher --cycle

# Clipboard history picker (no-op if cliphist not installed)
bindsym $mod+v              exec sh -c 'command -v cliphist >/dev/null && cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'

# ── Workspaces ────────────────────────────────────────────────────
bindsym $mod+1  workspace number 1
bindsym $mod+2  workspace number 2
bindsym $mod+3  workspace number 3
bindsym $mod+4  workspace number 4
bindsym $mod+5  workspace number 5
bindsym $mod+6  workspace number 6
bindsym $mod+7  workspace number 7
bindsym $mod+8  workspace number 8
bindsym $mod+9  workspace number 9
bindsym $mod+0  workspace number 10

# Move app to workspace + follow it
bindsym $mod+Shift+1  move container to workspace number 1; workspace number 1
bindsym $mod+Shift+2  move container to workspace number 2; workspace number 2
bindsym $mod+Shift+3  move container to workspace number 3; workspace number 3
bindsym $mod+Shift+4  move container to workspace number 4; workspace number 4
bindsym $mod+Shift+5  move container to workspace number 5; workspace number 5
bindsym $mod+Shift+6  move container to workspace number 6; workspace number 6
bindsym $mod+Shift+7  move container to workspace number 7; workspace number 7
bindsym $mod+Shift+8  move container to workspace number 8; workspace number 8
bindsym $mod+Shift+9  move container to workspace number 9; workspace number 9
bindsym $mod+Shift+0  move container to workspace number 10; workspace number 10

# Relative workspace switch
bindsym $mod+Ctrl+Right  workspace next
bindsym $mod+Ctrl+Left   workspace prev

# ── Scratchpad (85% × 80% of focused output, centered) ────────────
bindsym $mod+s          scratchpad show, resize set 85 ppt 80 ppt, move position center
bindsym $mod+Shift+s    move scratchpad, resize set 85 ppt 80 ppt

# ── Screenshots ───────────────────────────────────────────────────
bindsym Print           exec ~/.local/bin/screenshot.sh all
bindsym $mod+p          exec ~/.local/bin/screenshot.sh area
bindsym $mod+Shift+p    exec ~/.local/bin/screenshot.sh color

# ── Audio / Brightness (laptop F-keys) ────────────────────────────
bindsym --locked XF86AudioMute        exec pamixer -t
bindsym --locked XF86AudioLowerVolume exec pamixer -d 5
bindsym --locked XF86AudioRaiseVolume exec pamixer -i 5
bindsym --locked XF86AudioPlay        exec playerctl play-pause
bindsym --locked XF86AudioNext        exec playerctl next
bindsym --locked XF86AudioPrev        exec playerctl previous
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

# ── Reload ────────────────────────────────────────────────────────
bindsym $mod+Shift+c    reload
