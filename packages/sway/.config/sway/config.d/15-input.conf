# 15-input.conf — keyboard, touchpad, mouse

# All keyboards: US + BR/abnt2 layouts available, Alt+Shift toggles.
# Per-device starting layout (notebook → BR) is set by an autostart hook
# in 50-autostart.conf — sway's IPC can't override per-device xkb on reload.
input "type:keyboard" {
    xkb_layout us,br
    xkb_variant ,abnt2
    xkb_options grp:alt_shift_toggle
    repeat_delay 250
    repeat_rate 35
}

input "type:touchpad" {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    dwt enabled                 # disable-while-typing
    middle_emulation enabled
    scroll_method two_finger
    click_method clickfinger
    pointer_accel 0.2
}

input "type:pointer" {
    accel_profile flat
    pointer_accel 0
}

# Make Super+left-click drag windows, Super+right-click resize
floating_modifier $mod normal

# Focus follows mouse only if you explicitly move the cursor
focus_follows_mouse no

# G435: the headset's own volume control is stuck, firing KEY_VOLUMEUP
# ~28x/second (confirmed on /dev/input/event5). Every event ran the
# XF86AudioRaiseVolume bind, which pinned the sink at 100% and undid any
# change within ~100ms. Ignore that device so the volume keys on the
# keyboard stay in charge. Drop these two lines if the wheel ever unsticks.
input "1133:2763:Logitech_G_series_G435_Wireless_Gaming_Headset_Consumer_Control" {
    events disabled
}
