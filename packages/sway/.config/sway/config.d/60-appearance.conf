# 60-appearance.conf — cursor, fonts, gaps, swayfx effects

seat seat0 xcursor_theme Adwaita 24

font pango:JetBrainsMono Nerd Font 10

default_border          pixel 5
default_floating_border pixel 5
smart_borders no
smart_gaps off
gaps inner 6
gaps outer 8
hide_edge_borders none

# ── swayfx effects (ignored gracefully on plain Sway) ─────────────
corner_radius 10
blur enable
blur_passes 3
blur_radius 5
