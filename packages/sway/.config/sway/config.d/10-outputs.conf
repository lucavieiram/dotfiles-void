# 10-outputs.conf — display configuration
# Verify exact output names with: swaymsg -t get_outputs
#
# Physical layout: external monitor on the LEFT, laptop on the RIGHT.

# External monitor (left) — Acer KG241 on the NVIDIA dGPU.
# 75Hz is the HDMI ceiling for this panel (144Hz needs DisplayPort/DVI).
# FreeSync range is 48-75Hz; adaptive_sync makes frametimes in that window
# tear-free and smooth. Frames above 75fps fall back to tearing (allow_tearing
# in 30-rules.conf) for low latency — controlled per-game via the FPS cap.
output HDMI-A-2 {
    resolution 1920x1080@75Hz
    position 0,0
    scale 1
    adaptive_sync on
}

# Internal laptop display (right)
output eDP-1 {
    resolution 1920x1080@144Hz
    position 1920,0
    scale 1
    adaptive_sync off
}

# Background is set by swaybg (50-autostart.conf), not here, so a missing
# wallpaper file doesn't crash the Sway config load.
