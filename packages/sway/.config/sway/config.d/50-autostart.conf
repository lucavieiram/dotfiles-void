# 50-autostart.conf — programs launched with Sway

# Polkit agent (sudo prompts in GUI apps)
exec lxqt-policykit-agent

# Notification daemon
# exec dunst  # replaced by Quickshell

# Flatpak portal — Steam Flatpak (and other sandboxed apps) refuse to
# start unless flatpak-portal is already up. D-Bus auto-activation races
# against their initial check; pre-spawning here avoids the dance.
exec /usr/libexec/flatpak-portal

# Foot terminal server (footclient connects instantly)
exec foot --server

# Auto-tiling (smart split direction)
exec autotiling

# Wallpaper — single image, swayconf-style.
# Change wallpaper via: ~/.local/bin/wallpaper.sh select (updates the symlink)
exec_always sh -c 'pkill -x swaybg; swaybg -i ~/Pictures/Wallpapers/current.png -m fill &'

# Clipboard history (Super+V to pick) — gated on cliphist being installed.
# Without cliphist, basic copy/paste still works via wl-clipboard alone.
exec sh -c 'command -v cliphist >/dev/null && wl-paste --type text  --watch cliphist store'
exec sh -c 'command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store'

# Idle / lock daemon — paths are unquoted so ~ expands.
exec swayidle -w \
    timeout 300  "$HOME/.local/bin/lock-now.sh" \
    timeout 600  'swaymsg "output * dpms off"' \
        resume   'swaymsg "output * dpms on"' \
    before-sleep "$HOME/.local/bin/lock-now.sh" \
    lock         "$HOME/.local/bin/lock-now.sh"

# PipeWire — start only the main daemon. It auto-spawns wireplumber and
# pipewire-pulse via /etc/pipewire/pipewire.conf.d/*.conf (context.exec).
# Do NOT also start wireplumber/pipewire-pulse here: the pgrep guards race
# against pipewire's own context.exec and end up with duplicate wireplumber
# instances that wedge the D-Bus name (wpctl/pactl/pamixer all hang).
exec sh -c 'pgrep -x pipewire >/dev/null || pipewire &'

# Network + bluetooth tray applets (shown in waybar's tray module).
# exec nm-applet --indicator  # replaced by Quickshell
# exec blueman-applet  # replaced by Quickshell

# Acer WMI firmware soft-blocks bluetooth on every cold boot. Unblock
# at session start so bluetoothd can register the controller.
# (Passwordless via /etc/sudoers.d/10-rfkill-unblock — see 05-audio.sh.)
exec sudo rfkill unblock bluetooth

# Waybar — wait for pipewire-pulse socket before starting, otherwise the
# pulseaudio module crashes and takes waybar down with it. On cold boot
# pipewire-pulse can take 3-8s to come up after sway.
# Quickshell shell (packages/quickshell); replaced waybar 2026-11-22
exec qs

# Optional tray apps (skip silently if missing).
# Seafile is the file-sync client; swap it for whichever one you self-host.
# --command matches the flatpak's own .desktop entry.
exec sh -c 'flatpak info com.seafile.Client >/dev/null 2>&1 && \
    flatpak run --command=seafile-applet com.seafile.Client'
exec sh -c 'command -v keepassxc >/dev/null && keepassxc'
