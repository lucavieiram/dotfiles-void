# 00-env.conf — environment passed to dbus + per-user runit services.
#
# IMPORTANT: sway has no built-in "export VAR=value" directive. An
#   `exec_always export FOO=bar`
# only sets FOO in the subshell that immediately exits — sway and its
# children never see it. So the real env (XDG_CURRENT_DESKTOP,
# GDK_BACKEND, NIXOS_OZONE_WL, NVIDIA vars, …) is exported by
# ~/.zprofile and inherited by sway via the greetd wrapper:
#
#   tuigreet --cmd 'zsh -l -c "exec sway --unsupported-gpu"'
#
# This file only *propagates* whatever was already exported into
# dbus-activated and per-user runit services.

# GPU-specific env (rendered by installers/system/phases/03-gpu.sh).
# Real hardware → NVIDIA env vars exported via .zprofile.
# This file may be empty on integrated graphics — that's fine.
include /etc/sway/gpu-env.conf

# Import env into dbus + (if installed) turnstile / runit user services
exec_always dbus-update-activation-environment --systemd \
    DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP \
    XDG_SESSION_TYPE GDK_BACKEND QT_QPA_PLATFORM \
    NIXOS_OZONE_WL MOZ_ENABLE_WAYLAND 2>/dev/null

exec_always sh -c 'command -v turnstile-update-runit-env >/dev/null && \
    turnstile-update-runit-env \
      DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP \
      XDG_SESSION_TYPE GDK_BACKEND QT_QPA_PLATFORM \
      NIXOS_OZONE_WL MOZ_ENABLE_WAYLAND' 2>/dev/null
