# 45-shell.conf — Quickshell shell (packages/quickshell). Loaded after 40-binds.conf.
bindsym --no-warn $mod+a  exec qs ipc call panels toggleLauncher
bindsym $mod+Shift+t      exec qs ipc call panels toggleThemes
bindsym $mod+n            exec qs ipc call panels toggleRight
bindsym --no-warn $mod+Shift+w exec qs ipc call panels toggleWalls
bindsym --no-warn $mod+v  exec qs ipc call panels toggleClipboard
bindsym --no-warn Ctrl+Alt+Delete exec qs ipc call panels togglePower
# brightness keys: same brightnessctl as 40-binds.conf, then the on-screen bar
bindsym --no-warn --locked XF86MonBrightnessUp   exec brightnessctl set +5% && qs ipc call osd brightness
bindsym --no-warn --locked XF86MonBrightnessDown exec brightnessctl set 5%- && qs ipc call osd brightness
# screenshot (area) on Super+Shift+S; scratchpad moves to Super+Alt(+Shift)+S
bindsym --no-warn $mod+Shift+s      exec ~/.local/bin/screenshot.sh area
bindsym $mod+Mod1+s                 scratchpad show, resize set 85 ppt 80 ppt, move position center
bindsym $mod+Mod1+Shift+s           move scratchpad, resize set 85 ppt 80 ppt
