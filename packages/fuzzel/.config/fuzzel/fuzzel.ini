# Fuzzel — app launcher + dmenu (Gruvbox, swayconf-inspired)
dpi-aware=yes
font=JetBrainsMono Nerd Font:size=14
terminal=footclient
width=40
layer=overlay
prompt=" "
icon-theme=Papirus
exit-on-keyboard-focus-loss=no
inner-pad=10
fields=filename,name

[colors]
background=1d2021ee
text=ebdbb2ff
match=458588ff
selection=504945ff
selection-match=83a598ff
selection-text=fbf1c7ff
border=665c54ff

[border]
radius=10
width=2

